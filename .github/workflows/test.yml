name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Embedded offline tests
        run: ./toolreview test
      - name: Verify asset extraction and shell syntax
        run: |
          python3 tools/assets.py split toolreview /tmp/toolreview-assets
          python3 -m py_compile /tmp/toolreview-assets/assets/*.py
          python3 tools/assets.py join /tmp/toolreview-assets /tmp/toolreview-rebuilt
          cmp toolreview /tmp/toolreview-rebuilt
